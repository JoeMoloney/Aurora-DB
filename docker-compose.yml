services:
  aurora_db:
    image: postgres:latest
    restart: unless-stopped
    container_name: aurora_db
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: aurora_user
      POSTGRES_PASSWORD: aurora_pass
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: aurora
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d aurora_user"]
      interval: 5s
      timeout: 10s
      retries: 5
volumes:
  postgres:
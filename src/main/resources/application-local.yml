server:
  port: 4812
  servlet:
    context-path: /api

spring:
  r2dbc:
    aurora:
      url: r2dbc:postgresql://localhost:5432/aurora
      username: aurora_user
      password: aurora_pass

aurora-api:
  base-url: http://127.0.0.1:8082

services:
  aurora_db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: examplePassword
      POSTGRES_USER: exampleUser
    volumes:
      - auroradb_pgdata:/var/lib/postgresql/data

logging:
  level:
    org.springframework.r2dbc: INFO
    reactor: INFO